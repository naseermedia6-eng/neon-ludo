name: neon_ludo
description: A polished offline Ludo game.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.0.2
  shared_preferences: ^2.3.5
  flutter_webrtc: 0.12.9
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
